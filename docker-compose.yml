services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: medipilot
      POSTGRES_USER: medipilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Compose}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - medipilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medipilot -d medipilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  medipilot-postgres:
